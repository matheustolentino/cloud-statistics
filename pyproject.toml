dask = "*"
seaborn = "*"
colorcet = "*"
ipython = "^7.0"
ipykernel = "^6.25.1"
bottleneck = "^1.3.7"
distributed = "<2023.9.1"
vaex = "^4.17.0"
scikit-learn = "^1.3.1"
cloudnetpy = "^1.61.5"
rpgpy = "^0.15.8"
gfatpy = ">=0.13.0"
mayavi = "^4.8.2"
configobj = "^5.0.8"
